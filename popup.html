<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X Copy MD</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title" data-i18n="popup_title">X Copy Tweet as Markdown</div>
      <div class="subtitle" data-i18n="popup_subtitle">Settings</div>
    </header>

    <main>
      <label class="row">
        <input id="autoMarkdownCopy" type="checkbox" />
        <span>
          <div class="label" data-i18n="popup_autoMarkdownCopy_label">
            Shortcut: Ctrl/Cmd+C (copy) / Ctrl/Cmd+S (save)
          </div>
          <div class="hint" data-i18n="popup_autoMarkdownCopy_hint">
            Uses Ctrl/Cmd+C for copy, Ctrl/Cmd+S for save (depends on default action)
          </div>
        </span>
      </label>

      <label class="row">
        <input id="defaultSaveMarkdownFile" type="checkbox" />
        <span>
          <div class="label" data-i18n="popup_defaultSaveMarkdownFile_label">
            Default action: save as .md (Downloads)
          </div>
          <div class="hint" data-i18n="popup_defaultSaveMarkdownFile_hint">
            When enabled, the main action saves a .md file instead of copying to clipboard.
          </div>
        </span>
      </label>

      <label class="row">
        <input id="useLocalImages" type="checkbox" />
        <span>
          <div class="label" data-i18n="popup_useLocalImages_label">Use local images</div>
          <div class="hint" data-i18n="popup_useLocalImages_hint">
            Download main tweet images to Downloads/X-Copy/img
          </div>
        </span>
      </label>

      <div id="status" class="status" aria-live="polite"></div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
